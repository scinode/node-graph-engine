name: integration-dagster

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      NG_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install "aiida-core~=2.7" "aiida-pythonjob~=0.5.1" "pytest~=7.0" "pytest-cov~=2.7"
          pip install "dagster~=1.7" "dagster-webserver~=1.7"

      - name: Set up AiiDA profile
        run: verdi presto

      - name: Start services
        run: |
          export DAGSTER_HOME="${{ github.workspace }}/tests_integration/.dagster"
          mkdir -p "$DAGSTER_HOME"
          nohup python -m dagster_webserver -h 0.0.0.0 -p 3000 -w tests_integration/dagster_workspace.yaml >"$DAGSTER_HOME/webserver.log" 2>&1 &

      - name: Wait for services
        run: |
          ready=0
          for _ in {1..60}; do
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3000 >/dev/null 2>&1 && ready=1 || true
          if [ "$ready" -ne 1 ]; then
            echo "Dagster did not become ready in time."
            tail -n 200 "${{ github.workspace }}/tests_integration/.dagster/webserver.log" || true
            exit 1
          fi

      - name: Run integration tests
        run: |
          export DAGSTER_GRAPHQL_URL="http://localhost:3000/graphql"
          export DAGSTER_HOME="${{ github.workspace }}/tests_integration/.dagster"
          pytest tests_integration/test_engine_dagster_integration.py

      - name: Tear down services
        if: always()
        run: |
          pkill -f "dagster-webserver" || true
