name: integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: airflow
            extra: airflow
            service: airflow
            test: tests_integration/test_engine_airflow_integration.py
          - engine: prefect
            extra: prefect
            service: prefect
            test: tests_integration/test_engine_prefect_integration.py
          - engine: temporal
            extra: temporal
            service: temporal
            test: tests_integration/test_engine_temporal_integration.py
          - engine: dagster
            extra: dagster
            service: dagster
            test: tests_integration/test_engine_dagster_integration.py
    env:
      NG_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install "aiida-core~=2.7" "aiida-pythonjob~=0.4.8" "pytest~=7.0" "pytest-cov~=2.7"
          case "${{ matrix.engine }}" in
            airflow)
              pip install "apache-airflow~=3.1"
              ;;
            prefect)
              pip install "prefect~=3.4"
              ;;
            temporal)
              pip install "temporalio~=1.6"
              ;;
            dagster)
              pip install "dagster~=1.7"
              ;;
          esac

      - name: Set up AiiDA profile
        run: verdi presto

      - name: Start services
        run: |
          if [ "${{ matrix.engine }}" = "airflow" ]; then
            export AIRFLOW_HOME="${{ runner.temp }}/airflow"
            export AIRFLOW_UID="$(id -u)"
            export AIRFLOW_GID="0"
            mkdir -p "$AIRFLOW_HOME"
            chmod -R 777 "$AIRFLOW_HOME"
          fi
          docker compose -f tests_integration/docker-compose.yml up -d ${{ matrix.service }}

      - name: Wait for services
        run: |
          case "${{ matrix.engine }}" in
            airflow)
              ready=0
              for _ in {1..60}; do
                curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null 2>&1 && break
                sleep 2
              done
              curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null 2>&1 && ready=1 || true
              if [ "$ready" -ne 1 ]; then
                echo "Airflow did not become ready in time."
                docker compose -f tests_integration/docker-compose.yml logs airflow || true
                exit 1
              fi
              ;;
            prefect)
              ready=0
              for _ in {1..60}; do
                curl -fsS http://localhost:4200/api/health >/dev/null 2>&1 && break
                sleep 2
              done
              curl -fsS http://localhost:4200/api/health >/dev/null 2>&1 && ready=1 || true
              if [ "$ready" -ne 1 ]; then
                echo "Prefect did not become ready in time."
                docker compose -f tests_integration/docker-compose.yml logs prefect || true
                exit 1
              fi
              ;;
            temporal)
              ready=0
              for _ in {1..120}; do
                nc -z localhost 7233 >/dev/null 2>&1 && break
                sleep 2
              done
              nc -z localhost 7233 >/dev/null 2>&1 && ready=1 || true
              if [ "$ready" -ne 1 ]; then
                echo "Temporal did not become ready in time."
                docker compose -f tests_integration/docker-compose.yml logs temporal || true
                exit 1
              fi
              ;;
            dagster)
              ready=0
              for _ in {1..60}; do
                curl -fsS http://localhost:3000 >/dev/null 2>&1 && break
                sleep 2
              done
              curl -fsS http://localhost:3000 >/dev/null 2>&1 && ready=1 || true
              if [ "$ready" -ne 1 ]; then
                echo "Dagster did not become ready in time."
                docker compose -f tests_integration/docker-compose.yml logs dagster || true
                exit 1
              fi
              ;;
          esac

      - name: Run integration tests
        run: |
          if [ "${{ matrix.engine }}" = "airflow" ]; then
            export NG_AIRFLOW_INTEGRATION=1
            export AIRFLOW_HOME="${{ runner.temp }}/airflow"
            export NG_AIRFLOW_RESULT_TIMEOUT=600
          elif [ "${{ matrix.engine }}" = "prefect" ]; then
            export PREFECT_API_URL="http://localhost:4200/api"
          elif [ "${{ matrix.engine }}" = "temporal" ]; then
            export TEMPORAL_ADDRESS="localhost:7233"
          elif [ "${{ matrix.engine }}" = "dagster" ]; then
            export DAGSTER_GRAPHQL_URL="http://localhost:3000/graphql"
            export DAGSTER_HOME="${{ github.workspace }}/tests_integration/.dagster"
          fi
          pytest "${{ matrix.test }}"

      - name: Tear down services
        if: always()
        run: docker compose -f tests_integration/docker-compose.yml down -v
