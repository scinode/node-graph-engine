name: integration-temporal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      NG_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install "aiida-core~=2.7" "aiida-pythonjob~=0.5.1" "pytest~=7.0" "pytest-cov~=2.7"
          pip install "temporalio~=1.6"

      - name: Set up AiiDA profile
        run: verdi presto

      - name: Install Temporal CLI
        run: |
          curl -fsSL https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start services
        run: |
          export TEMPORAL_HOME="${{ runner.temp }}/temporal"
          mkdir -p "$TEMPORAL_HOME"
          nohup temporal server start-dev --ip 0.0.0.0 --port 7233 --db-filename "$TEMPORAL_HOME/temporal.db" --headless >"$TEMPORAL_HOME/temporal.log" 2>&1 &

      - name: Wait for services
        run: |
          ready=0
          for _ in {1..120}; do
            nc -z localhost 7233 >/dev/null 2>&1 && break
            sleep 2
          done
          nc -z localhost 7233 >/dev/null 2>&1 && ready=1 || true
          if [ "$ready" -ne 1 ]; then
            echo "Temporal did not become ready in time."
            tail -n 200 "${{ runner.temp }}/temporal/temporal.log" || true
            exit 1
          fi

      - name: Run integration tests
        run: |
          export TEMPORAL_ADDRESS="localhost:7233"
          pytest tests_integration/test_engine_temporal_integration.py

      - name: Tear down services
        if: always()
        run: |
          pkill -f "temporal server start-dev" || true
