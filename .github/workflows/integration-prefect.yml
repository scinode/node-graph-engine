name: integration-prefect

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      NG_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install "aiida-core~=2.7" "aiida-pythonjob~=0.5.1" "pytest~=7.0" "pytest-cov~=2.7"
          pip install "prefect~=3.4"

      - name: Set up AiiDA profile
        run: verdi presto

      - name: Start services
        run: docker compose -f docker-compose.yml --profile integration up -d prefect

      - name: Wait for services
        run: |
          ready=0
          for _ in {1..60}; do
            curl -fsS http://localhost:4200/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:4200/api/health >/dev/null 2>&1 && ready=1 || true
          if [ "$ready" -ne 1 ]; then
            echo "Prefect did not become ready in time."
            docker compose -f tests_integration/docker-compose.yml logs prefect || true
            exit 1
          fi

      - name: Run integration tests
        run: |
          export PREFECT_API_URL="http://localhost:4200/api"
          pytest tests_integration/test_engine_prefect_integration.py

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.yml --profile integration down -v
