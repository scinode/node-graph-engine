name: CI

on:
  push:
    branches:
      - main
  pull_request:


jobs:

  pre-commit:

        runs-on: ubuntu-latest

        steps:
        -   uses: actions/checkout@v2

        -   name: Cache Python dependencies
            uses: actions/cache@v3
            with:
                path: ~/.cache/pip
                key: pip-pre-commit-${{ hashFiles('**/setup.json') }}
                restore-keys:
                    pip-pre-commit-

        -   name: Set up Python
            uses: actions/setup-python@v2
            with:
                python-version: '3.11'

        -   name: Install Python dependencies
            run: pip install -e .[pre-commit,tests]

        -   name: Run pre-commit
            run: pre-commit run --all-files || ( git status --short ; git diff ; exit 1 )


  test:

    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:latest
        ports:
        -   5672:5672
      neo4j:
        image: neo4j:latest
        env:
          NEO4J_AUTH: neo4j/secretgraph
        ports:
        -   7474:7474
        -   7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p secretgraph 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install Python dependencies
        run: |
          pip install -e .[tests,jobflow,parsl,prefect,executorlib,redun,dagster,dask]
          verdi presto
      - name: Wait for Neo4j
        run: |
          for i in {1..30}; do
            nc -z localhost 7687 && exit 0
            sleep 2
          done
          echo "Neo4j did not become ready in time" >&2
          exit 1
      - name: Run pytest
        env:
          NODE_GRAPH_NEO4J_URI: bolt://localhost:7687
          NODE_GRAPH_NEO4J_USER: neo4j
          NODE_GRAPH_NEO4J_PASSWORD: secretgraph
        run: |
          cd tests
          pytest -v --cov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
