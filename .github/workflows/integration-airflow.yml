name: integration-airflow

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      NG_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install "aiida-core~=2.7" "aiida-pythonjob~=0.5.1" "pytest~=7.0" "pytest-cov~=2.7"
          pip install "pytest-timeout~=2.3"
          pip install "apache-airflow~=3.1"

      - name: Set up AiiDA profile
        run: verdi presto

      - name: Start services
        run: |
          export AIRFLOW_HOME="${{ runner.temp }}/airflow"
          export AIRFLOW__CORE__DAGS_FOLDER="$AIRFLOW_HOME/dags"
          export AIRFLOW__CORE__LOAD_EXAMPLES="False"
          export AIRFLOW__CORE__EXECUTOR="SequentialExecutor"
          export AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL="5"
          export AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL="5"
          mkdir -p "$AIRFLOW_HOME/dags"
          airflow db migrate
          nohup airflow api-server --port 8080 >"$AIRFLOW_HOME/api-server.log" 2>&1 &
          nohup airflow scheduler >"$AIRFLOW_HOME/scheduler.log" 2>&1 &
          nohup airflow dag-processor >"$AIRFLOW_HOME/dag-processor.log" 2>&1 &
          nohup airflow triggerer >"$AIRFLOW_HOME/triggerer.log" 2>&1 &

      - name: Wait for services
        run: |
          ready=0
          for _ in {1..60}; do
            curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null 2>&1 && ready=1 || true
          if [ "$ready" -ne 1 ]; then
            echo "Airflow did not become ready in time."
            exit 1
          fi

      - name: Run integration tests
        run: |
          export NG_AIRFLOW_INTEGRATION=1
          export AIRFLOW_HOME="${{ runner.temp }}/airflow"
          export AIRFLOW__CORE__DAGS_FOLDER="$AIRFLOW_HOME/dags"
          export NG_AIRFLOW_RESULT_TIMEOUT=150
          pytest tests_integration/test_engine_airflow_integration.py -s -vv --maxfail=1 --timeout=150

      - name: Tear down services
        if: always()
        run: |
          pkill -f "airflow api-server" || true
          pkill -f "airflow scheduler" || true
          pkill -f "airflow dag-processor" || true
          pkill -f "airflow triggerer" || true
