version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  jobs:
    post_create_environment:
      - python -m pip install --no-cache-dir .[docs,parsl]
      - verdi presto
      - verdi code create core.code.installed --label python3 --computer=localhost --default-calc-job-plugin pythonjob.pythonjob --filepath-executable=$(which python) -n
  apt_packages:
    - graphviz

# Build from the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Explicitly set the version of Python and its requirements
python:
  install:
    - requirements: docs/requirements.txt
